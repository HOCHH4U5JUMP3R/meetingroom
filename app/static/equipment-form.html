<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ausstattung hinzufügen</title><link rel="stylesheet" href="/static/style.css?v=18"></head>
<body><header class="form-header"><div><h1 id="pageTitle">Ausstattung hinzufügen</h1><p>Gerät für den ausgewählten Meetingraum verwalten</p></div></header><main><form id="entityForm" class="formPage"><section class="card"><div class="cardHead"><h3>Gerätedaten</h3></div><div class="formGrid"><div class="field"><label>Gerätename *</label><input name="name" required></div><div class="field"><label>Kategorie *</label><select name="category" required><option value="Monitor">Monitor</option><option value="VC-System">VC-System</option><option value="Mikrofon">Mikrofon</option><option value="Lautsprecher">Lautsprecher</option><option value="Zubehör">Zubehör</option></select></div><div class="field"><label>Hersteller</label><input name="manufacturer"></div><div class="field"><label>Modell</label><input name="model" placeholder="z. B. Room Kit EQ"></div><div class="field"><label>Seriennummer</label><input name="serial"></div><div class="field"><label>Größe (Zoll)</label><input name="size_inches" type="number" step="0.1"></div><div class="field"><label>Montage</label><input name="mounting"></div><div class="field"><label>Status</label><input name="status" value="Aktiv"></div><div class="field"><label>Kaufdatum</label><input name="purchase_date" type="date"></div><div class="field"><label>Kaufpreis (€)</label><input name="purchase_price" type="number" min="0" step="0.01"></div><div class="field"><label>Host-Name (nur VC-System)</label><input name="host_name"></div><div class="field"><label>Inventarnummer</label><input name="inventory_number"></div><div class="field"><label>MAC-Adresse</label><input name="mac_address"></div><div class="field"><label>Angebot</label><input name="offerFile" type="file" accept="application/pdf,image/*"></div><div class="field"><label>Rechnung</label><input name="invoiceFile" type="file" accept="application/pdf,image/*"></div><div class="field"><label>Modellbild</label><input name="imageFile" type="file" accept="image/*"></div><div class="field full"><label>Anmerkungen</label><textarea name="notes" rows="4"></textarea></div></div></section><p id="formMessage" class="form-message" role="alert"></p><div class="formActions pageActions"><button type="button" id="cancel" class="btn">Abbrechen</button><button type="submit" class="btn btn-primary">Speichern</button></div></form></main><script id="formConfig" type="application/json">{"kind":"equipment","collection":"equipment","editTitle":"Ausstattung bearbeiten","fields":[{"name":"name","type":"text"},{"name":"category","type":"text"},{"name":"manufacturer","type":"text"},{"name":"model","type":"text"},{"name":"serial","type":"text"},{"name":"size_inches","type":"number"},{"name":"mounting","type":"text"},{"name":"status","type":"text"},{"name":"purchase_date","type":"date"},{"name":"purchase_price","type":"number"},{"name":"host_name","type":"text"},{"name":"inventory_number","type":"text"},{"name":"mac_address","type":"text"},{"name":"notes","type":"textarea"}]}</script><script src="/static/entity-form.js"></script></body></html>
