<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ausstattung · Meetingroom</title><link rel="stylesheet" href="/static/style.css?v=41"><link rel="stylesheet" href="/static/forms.css?v=2"><link rel="stylesheet" href="/static/models.css?v=2"></head><body class="v2"><header class="form-header"><div><div class="eyebrow">ASSET MANAGEMENT</div><h1 id="pageTitle">Ausstattung hinzufügen</h1><p>Gerät erfassen – die technischen Felder passen sich automatisch an Kategorie und Modell an.</p></div></header><main><form id="entityForm" class="formPage"><section class="card"><div class="cardHead"><h3>Gerätedaten</h3></div><div class="formGrid"><div class="model-select-wrap"><label>MODELL AUS KATALOG</label><select id="modelSelector"><option value="">Kein Modell – Kategorie manuell auswählen</option></select><div id="modelPreview" class="model-preview"></div></div><div class="field"><label>Gerätename *</label><input name="name" required placeholder="z. B. Hauptdisplay Raum 101"></div><div class="field"><label>Kategorie *</label><select name="category" required><option value="">Bitte auswählen</option><option>Monitor</option><option>TV / Display</option><option>VC-System</option><option>Kamera</option><option>Mikrofon</option><option>Lautsprecher</option><option>PC</option><option>Netzwerk</option><option>Steuerung</option><option>Zubehör</option><option>Sonstiges</option></select></div><div class="field"><label>Hersteller</label><input name="manufacturer"></div><div class="field"><label>Modell / Artikelnummer</label><input name="model"></div><div class="field"><label>Seriennummer</label><input name="serial"></div><div class="field" id="field-size"><label>Größe (Zoll)</label><input name="size_inches" type="number" step="0.1"></div><div class="field" id="field-mounting"><label>Montage</label><select name="mounting"><option value="">Keine Angabe</option><option>Wand</option><option>Decke</option><option>Tisch</option><option>Ständer</option><option>Rack</option><option>Einbau</option><option>Mobil</option></select></div><div class="field"><label>Status</label><select name="status"><option>Aktiv</option><option>Defekt</option><option>Außer Betrieb</option><option>Ausgemustert</option></select></div><div class="field"><label>Kaufdatum</label><input name="purchase_date" type="date"></div><div class="field"><label>Kaufpreis (€)</label><input name="purchase_price" type="number" min="0" step="0.01"></div><div class="field" id="field-host"><label>Host-Name</label><input name="host_name" placeholder="z. B. MTR-NU-101"></div><div class="field"><label>Inventarnummer</label><input name="inventory_number"></div><div class="field" id="field-mac"><label>MAC-Adresse</label><input name="mac_address" placeholder="AA:BB:CC:DD:EE:FF"></div><div class="field"><label>Produktbild</label><input name="imageFile" type="file" accept="image/*"><span class="field-hint">Optional: individuelles Gerätebild. Ohne Bild wird das Modellbild verwendet.</span></div><div class="field"><label>Angebot</label><input name="offerFile" type="file" accept="application/pdf,image/*"></div><div class="field"><label>Rechnung</label><input name="invoiceFile" type="file" accept="application/pdf,image/*"></div><div class="field full"><label>Anmerkungen</label><textarea name="notes" rows="4" placeholder="Besonderheiten, Standortdetails, technische Hinweise …"></textarea></div></div></section><p id="formMessage" class="form-message" role="alert"></p><div class="formActions pageActions"><button type="button" id="cancel" class="btn">Abbrechen</button><button type="submit" class="btn btn-primary">Speichern</button></div></form></main><script id="formConfig" type="application/json">{"kind":"equipment","collection":"equipment","editTitle":"Ausstattung bearbeiten","fields":[{"name":"name","type":"text"},{"name":"category","type":"text"},{"name":"manufacturer","type":"text"},{"name":"model","type":"text"},{"name":"serial","
