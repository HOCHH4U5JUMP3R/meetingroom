<!doctype html>
<html lang="de">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Raum bearbeiten</title>

    <link rel="stylesheet" href="/static/style.css?v=3">

</head>

<body>

<header>

    <div>

        <h1 id="pageTitle">
            Neuer Raum
        </h1>

        <p>
            Stammdaten des Meetingraums
        </p>

    </div>

</header>


<main>

    <form id="roomForm" class="formPage">

        <section class="card">

            <div class="cardHead">
                <h3>Raumdaten</h3>
            </div>

            <div class="formGrid">

                <div class="field">
                    <label>Besprechungsraumname *</label>
                    <input name="name" required>
                </div>

                <div class="field">
                    <label>Standort</label>
                    <input name="site">
                </div>

                <div class="field">
                    <label>Gebäude</label>
                    <input name="building">
                </div>

                <div class="field">
                    <label>Etage</label>
                    <input name="floor">
                </div>

                <div class="field">
                    <label>Raumnummer</label>
                    <input name="room_number">
                </div>

                <div class="field">
                    <label>Sitzplätze</label>
                    <input
                        name="seats"
                        type="number">
                </div>

                <div class="field">
                    <label>Länge (m)</label>
                    <input
                        name="length"
                        type="number"
                        step="0.01">
                </div>

                <div class="field">
                    <label>Breite (m)</label>
                    <input
                        name="width"
                        type="number"
                        step="0.01">
                </div>

                <div class="field">
                    <label>Höhe (m)</label>
                    <input
                        name="height"
                        type="number"
                        step="0.01">
                </div>

                <div class="field">
                    <label>Raumkategorie</label>
                    <input name="category">
                </div>

                <div class="field">
                    <label>Raumverantwortlicher</label>
                    <input name="owner">
                </div>

                <div class="field">
                    <label>Host-Name</label>
                    <input name="host_name">
                </div>

                <div class="field">
                    <label>Outlook-Ressource</label>
                    <input name="outlook_resource">
                </div>

                <div class="field">
                    <label>Status</label>
                    <input name="status">
                </div>

                <div class="field full">
                    <label>Anschlussmöglichkeiten</label>
                    <textarea
                        name="connections"
                        rows="3"></textarea>
                </div>

                <div class="field full">
                    <label>Raum-Besonderheiten</label>
                    <textarea
                        name="specialty"
                        rows="3"></textarea>
                </div>

                <div class="field full">
                    <label>Anmerkungen</label>
                    <textarea
                        name="notes"
                        rows="4"></textarea>
                </div>

            </div>

        </section>


        <div class="formActions pageActions">

            <button
                type="button"
                id="cancel">
                Abbrechen
            </button>

            <button
                type="submit"
                class="primary">
                Speichern
            </button>

        </div>

    </form>

</main>


<script>

const params =
    new URLSearchParams(window.location.search);

const roomId =
    params.get('id');


const form =
    document.querySelector('#roomForm');

const title =
    document.querySelector('#pageTitle');


const fields = [
    'name',
    'site',
    'building',
    'floor',
    'room_number',
    'seats',
    'length',
    'width',
    'height',
    'category',
    'owner',
    'host_name',
    'outlook_resource',
    'connections',
    'specialty',
    'notes',
    'status'
];


async function loadRoom() {

    if (!roomId) {
        return;
    }


    title.textContent =
        'Raum bearbeiten';


    const response =
        await fetch(`/api/rooms/${roomId}`);

    const room =
        await response.json();


    for (const field of fields) {

        const input =
            form.elements[field];

        if (input) {
            input.value =
                room[field] ?? '';
        }
    }
}


form.onsubmit = async event => {

    event.preventDefault();


    const data = {};


    for (const field of fields) {

        const input =
            form.elements[field];

        if (!input) {
            continue;
        }


        let value =
            input.value;


        if (
            ['seats'].includes(field)
        ) {
            value =
                value
                    ? Number(value)
                    : null;
        }


        if (
            ['length', 'width', 'height']
                .includes(field)
        ) {
            value =
                value
                    ? Number(value)
                    : null;
        }


        data[field] = value;
    }


    const response =
        await fetch(
            roomId
                ? `/api/rooms/${roomId}`
                : '/api/rooms',
            {
                method:
                    roomId
                        ? 'PUT'
                        : 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify(data)
            }
        );


    if (!response.ok) {

        const error =
            await response.json();

        alert(
            error.detail ||
            'Speichern fehlgeschlagen'
        );

        return;
    }


    const saved =
        await response.json();


    window.location.href =
        `/static/index.html`;
};


document.querySelector('#cancel').onclick =
    () => {

        window.location.href =
            '/static/index.html';

    };


loadRoom();

</script>

</body>
</html>
