<!doctype html>
<html lang="de">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Raum bearbeiten</title>

    <link rel="stylesheet" href="/static/style.css?v=18">

</head>

<body>

<header>

    <div>

        <h1 id="pageTitle">
            Neuer Raum
        </h1>

        <p>
            Stammdaten des Meetingraums
        </p>

    </div>

</header>


<main>

    <form id="roomForm" class="formPage">

        <section class="card">

            <div class="cardHead">
                <h3>Raumdaten</h3>
            </div>

            <div class="formGrid">

                <div class="field">
                    <label>Besprechungsraumname *</label>
                    <input name="name" required>
                </div>

                <div class="field">
                    <label>Standort</label>
                    <select name="site">
                        <option value="">Bitte wählen</option><option>Nürnberg</option><option>Überlingen</option><option>Frankfurt</option><option>Rostock</option><option>Laupheim</option><option>Dresden</option><option>Gilching</option><option>Hamburg</option><option>Nyírbátor</option><option>Debrecen</option><option>Toulouse</option><option>Colomiers</option><option>Queretaro</option><option>Craiova</option>
                    </select>
                </div>

                <div class="field">
                    <label>Gebäude</label>
                    <input name="building">
                </div>

                <div class="field">
                    <label>Etage</label>
                    <input name="floor">
                </div>

                <div class="field">
                    <label>Raumnummer</label>
                    <input name="room_number">
                </div>

                <div class="field">
                    <label>Sitzplätze</label>
                    <input
                        name="seats"
                        type="number">
                </div>

                <div class="field">
                    <label>Länge (m)</label>
                    <input
                        name="length"
                        type="number"
                        step="0.01">
                </div>

                <div class="field">
                    <label>Breite (m)</label>
                    <input
                        name="width"
                        type="number"
                        step="0.01">
                </div>

                <div class="field">
                    <label>Raumgröße</label>
                    <output id="areaPreview" class="calculated-value">Wird aus Länge × Breite berechnet</output>
                </div>

                <div class="field">
                    <label>Raumkategorie</label>
                    <select name="category"><option value="">Bitte wählen</option><option>Besprechungsraum</option><option>VK-Klein</option><option>VK-Mittel</option><option>VK-Groß</option><option>Spezial</option></select>
                </div>

                <div class="field">
                    <label>Raumverantwortlicher</label>
                    <input name="owner">
                </div>

                <div class="field">
                    <label>Outlook-Ressource</label>
                    <input name="outlook_resource">
                </div>

                <div class="field">
                    <label>Status</label>
                    <select name="status"><option>Aktiv</option><option>Modernisierung notwendig</option><option>Modernisierung geplant</option><option>Störung</option><option>Inaktiv</option></select>
                </div>

                <fieldset class="field full checkbox-fieldset">
                    <legend>Anschlussmöglichkeiten</legend>
                    <label><input name="connections_choice" value="Wireless MiraCast" type="checkbox"> Wireless MiraCast</label>
                    <label><input name="connections_choice" value="HDMI" type="checkbox"> HDMI</label>
                    <label><input name="connections_choice" value="USB-C" type="checkbox"> USB-C</label>
                </fieldset>

                <div class="field full">
                    <label>Raumbild</label>
                    <input name="roomImageFile" type="file" accept="image/*">
                    <span class="field-hint">Ein Bild des Raums wird auf der Raumakte angezeigt.</span>
                </div>

                <div class="field full">
                    <label>Raum-Besonderheiten</label>
                    <textarea
                        name="specialty"
                        rows="3"></textarea>
                </div>

                <div class="field full">
                    <label>Anmerkungen</label>
                    <textarea
                        name="notes"
                        rows="4"></textarea>
                </div>

            </div>

        </section>


        <div class="formActions pageActions">

            <button
                type="button"
                id="cancel">
                Abbrechen
            </button>

            <button
                type="submit"
                class="primary">
                Speichern
            </button>

        </div>

    </form>

</main>


<script>

const params =
    new URLSearchParams(window.location.search);

const roomId =
    params.get('id');


const form =
    document.querySelector('#roomForm');

const title =
    document.querySelector('#pageTitle');


const field = name => form.elements.namedItem(name);

const fields = [
    'name',
    'site',
    'building',
    'floor',
    'room_number',
    'seats',
    'length',
    'width',
    'category',
    'owner',
    'outlook_resource',
    'specialty',
    'notes',
    'status',
    'last_modernization'
];


function updateAreaPreview() {
    const length = Number(field('length').value);
    const width = Number(field('width').value);
    const preview = document.querySelector('#areaPreview');
    preview.textContent = length > 0 && width > 0
        ? `${(length * width).toLocaleString('de-DE', { maximumFractionDigits: 2 })} m²`
        : 'Wird aus Länge × Breite berechnet';
}

field('length').addEventListener('input', updateAreaPreview);
field('width').addEventListener('input', updateAreaPreview);

async function loadRoom() {

    if (!roomId) {
        return;
    }


    title.textContent =
        'Raum bearbeiten';


    const response =
        await fetch(`/api/rooms/${roomId}`);

    const room =
        await response.json();


    for (const field of fields) {

        const input =
            form.elements.namedItem(field);

        if (input) {
            input.value =
                room[field] ?? '';
        }
    }    const connections = String(room.connections || '').split(' · ');
    form.querySelectorAll('[name="connections_choice"]').forEach(input => { input.checked = connections.includes(input.value); });
    updateAreaPreview();
}


form.onsubmit = async event => {

    event.preventDefault();


    const data = {};


    for (const field of fields) {

        const input =
            form.elements.namedItem(field);

        if (!input) {
            continue;
        }


        let value =
            input.value;


        if (
            ['seats'].includes(field)
        ) {
            value =
                value
                    ? Number(value)
                    : null;
        }


        if (
            ['length', 'width']
                .includes(field)
        ) {
            value =
                value
                    ? Number(value)
                    : null;
        }


        data[field] = value;
    }

    data.connections = Array.from(form.querySelectorAll('[name="connections_choice"]:checked')).map(input => input.value).join(' · ');

    const response =
        await fetch(
            roomId
                ? `/api/rooms/${roomId}`
                : '/api/rooms',
            {
                method:
                    roomId
                        ? 'PUT'
                        : 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify(data)
            }
        );


    if (!response.ok) {

        const error =
            await response.json();

        alert(
            error.detail ||
            'Speichern fehlgeschlagen'
        );

        return;
    }


    const saved =
        await response.json();

    const image = field('roomImageFile').files[0];
    if (image) {
        const imageData = new FormData();
        imageData.append('file', image);
        const imageResponse = await fetch(`/api/rooms/${saved.id}/image`, { method: 'POST', body: imageData });
        if (!imageResponse.ok) {
            const error = await imageResponse.json();
            alert(error.detail || 'Raumbild konnte nicht hochgeladen werden');
            return;
        }
    }

    window.location.href =
        `/static/room-detail.html?id=${saved.id}`;
};


document.querySelector('#cancel').onclick =
    () => {

        window.location.href =
            roomId ? `/static/room-detail.html?id=${roomId}` : '/static/index.html';

    };


updateAreaPreview();
loadRoom();

</script>

</body>
</html>
