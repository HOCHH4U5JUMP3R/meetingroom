<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modernisierung · Meetingroom</title><link rel="stylesheet" href="/static/style.css?v=42"><link rel="stylesheet" href="/static/forms.css?v=4"><style>.document-list{display:flex;gap:8px;flex-wrap:wrap}.document-chip{display:inline-flex;align-items:center;gap:7px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);text-decoration:none;font-size:12px}.document-chip small{color:var(--muted)}.timeline{padding:18px 22px}.timeline-item{display:flex;gap:12px;padding:10px 0}.timeline-dot{width:9px;height:9px;border-radius:50%;background:var(--primary);margin-top:5px;flex:0 0 auto}.timeline-item strong{display:block;font-size:12px}.timeline-item small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.timeline-item p{margin:4px 0 0;font-size:11px;color:var(--muted)}</style></head><body class="v2"><header class="form-header"><div><div class="eyebrow">ROADMAP</div><h1 id="pageTitle">Modernisierung hinzufügen</h1><p>Projekt, Investition und Umsetzung – optional einem bestehenden Meetingraum zuordnen.</p></div></header><main><form id="entityForm" class="formPage"><section class="card"><div class="cardHead"><h3>Projektdaten</h3></div><div class="formGrid"><div class="field"><label>Projektname *</label><input name="project_name" required></div><div class="field"><label>Jahr</label><input name="project_year" type="number" min="2020" max="2100"></div><div class="field"><label>Status</label><select name="status"><option>Idee</option><option>Planung</option><option>Beantragt</option><option>Freigegeben</option><option>Beauftragt</option><option>In Umsetzung</option><option>Abgeschlossen</option><option>Gestoppt</option></select></div><div class="field"><label>Budget (€)</label><input name="budget" type="number" min="0" step="0.01"></div><div class="field"><label>Beauftragt (€)</label><input name="commissioned" type="number" min="0" step="0.01"></div><div class="field"><label>Ist-Kosten (€)</label><input name="actual_cost" type="number" min="0" step="0.01"></div><div class="field"><label>Lieferant</label><select name="supplier"><option value="">Bitte auswählen</option><option>Jäckel IT</option><option>SanData</option><option>Diehl</option><option>Sonstige</option></select></div><div class="field"><label>Verantwortlich</label><select name="responsible"><option value="">Nicht zugewiesen</option><option>IT / Workplace Management</option><option>IT Service Desk</option><option>Facility Management</option><option>Externer Dienstleister</option></select></div><div class="field"><label>Startdatum</label><input name="start_date" type="date"></div><div class="field"><label>Geplantes Ende</label><input name="planned_end" type="date"></div><div class="field"><label>Abschlussdatum</label><input name="completion_date" type="date"></div><div class="field"><label>Bestellnummer</label><input name="order_number"></div><div class="field full"><label>Anmerkungen</label><textarea name="notes" rows="5"></textarea></div></div></section>
<section class="card"><div class="cardHead"><h3>Dokumente</h3></div><div class="formGrid"><div class="field"><label>Angebot</label><input id="offerFile" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></div><div class="field"><label>Rechnung</label><input id="invoiceFile" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></div><div class="field full"><div id="existingDocuments" class="document-list"></div></div></div></section>
