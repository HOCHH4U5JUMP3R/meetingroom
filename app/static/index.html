<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meetingraumverwaltung – Übersicht</title>
  <link rel="stylesheet" href="/static/style.css?v=12">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Meetingraumverwaltung</h1>
      <p>Standorte und Meetingräume im Überblick</p>
    </div>
    <a href="/static/room-form.html" class="btn btn-primary">＋ Neuer Raum</a>
  </header>
  <main>
    <section class="overview-hero">
      <div>
        <div class="eyebrow">RAUMÜBERSICHT</div>
        <h2>Meetingräume finden</h2>
        <p>Wähle einen Standort oder suche direkt nach Raumname, Raumnummer, Gebäude oder Ausstattung.</p>
      </div>
      <div class="overview-count"><strong id="roomCount">–</strong><span>Räume</span></div>
    </section>

    <section class="overview-controls" aria-label="Raumfilter">
      <label class="search-field" for="roomSearch"><span aria-hidden="true">⌕</span><input id="roomSearch" type="search" placeholder="Raum suchen …" autocomplete="off"></label>
      <div id="siteFilters" class="site-filters" aria-label="Standort auswählen"></div>
    </section>

    <section id="overviewEmpty" class="empty-state" hidden>
      <div class="empty-icon">⌂</div>
      <h2>Keine Räume gefunden</h2>
      <p>Ändere die Suche oder lege einen neuen Meetingraum an.</p>
    </section>
    <section id="roomGroups" class="site-groups" aria-live="polite"></section>
  </main>
  <script src="/static/overview.js?v=12"></script>
</body>
</html>
