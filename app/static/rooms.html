<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Räume · Meetingroom</title><link rel="stylesheet" href="/static/style.css?v=36"><style>
.room-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.room-toolbar input,.room-toolbar select{min-height:36px}.room-toolbar input{min-width:260px}.room-import-link{font-size:10px;color:var(--muted);text-decoration:none;padding:8px 4px}.room-import-link:hover{color:var(--primary)}.room-directory{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.room-card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px;transition:.16s ease;min-height:150px}.room-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#cbd5e1}.room-card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.room-card h3{margin:0;font-size:14px;line-height:1.25}.room-number{font-size:9px;color:var(--muted);margin-top:4px}.room-status{display:inline-flex;padding:4px 7px;border-radius:7px;background:#ecfdf3;color:#15803d;font-size:8px;font-weight:800;white-space:nowrap}.room-meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.room-meta span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.room-meta strong{display:block;font-size:11px;margin-top:2px}.room-location{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);font-size:9px;color:var(--muted)}.room-empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)}@media(max-width:700px){.room-toolbar input{min-width:180px;width:100%}}
</style></head><body class="v2"><header class="v2-topbar"><button class="v2-mobile-nav" onclick="document.body.classList.toggle('nav-open')">☰</button><a class="v2-logo" href="/">MEETING<span>ROOM</span></a><label class="v2-global-search"><span>⌕</span><input id="q" placeholder="Raum, Standort, Gebäude, Hostname …"></label><a class="v2-top-action" href="/static/room-form.html">＋ Neuer Raum</a></header><aside class="v2-sidebar"><nav><a href="/"><b>⌂</b>Dashboard</a><a class="active" href="/static/rooms.html"><b>▦</b>Räume</a><a href="/static/models.html"><b>◇</b>Modelle</a><a href="/static/equipment.html"><b>▤</b>Equipment</a><a href="/static/tickets.html"><b>◉</b>Tickets</a><a href="/static/modernization.html"><b>⚒</b>Modernisierung</a><a href="/static/budget.html"><b>€</b>Budget</a></nav><div class="v2-sidebar-footer">Meetingroom V2<br><span>Workplace Management</span></div></aside><main class="v2-main"><section class="v2-welcome"><div><div class="eyebrow">RAUMVERZEICHNIS</div><h1>Räume</h1><p>Alle Meetingräume, Standorte und Raumressourcen auf einen Blick.</p></div><a class="btn btn-primary" href="/static/room-form.html">＋ Raum anlegen</a></section><section class="v2-card"><div class="v2-card-head"><div><div class="eyebrow">INVENTAR</div><h2>Raumverzeichnis</h2><p id="roomCount" class="room-count">Wird geladen …</p></div><div class="room-toolbar"><input id="filter" placeholder="Räume durchsuchen …"><select id="site"><option value="">Alle Standorte</option></select><a class="room-import-link" href="/api/rooms/import-template">↓ Excel-Vorlage</a><label class="room-import-link" style="cursor:pointer">↑ Excel-Import<input id="excelFile" type="file" accept=".xlsx,.xlsm" hidden></label></div></div><div id="error" class="form-message" role="alert" hidden></div><div id="importResult" class="room-count" hidden></div><div id="rows" class="room-directory"></div></section></main><script>
const $=s=>document.querySelector(s),rows=$('#rows'),q=$('#q'),filter=$('#filter'),site=$('#site'),result=$('#importResult');let rooms=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function render(){const term=(q.value+' '+filter.value).trim().toLowerCase(),sel=site.value;const list=rooms.filter(r=>(!sel||r.site===sel)&&(!term||[r.name,r.site,r.building,r.floor,r.room_number,r.host_name,r.category].some(v=>String(v||'').toLowerCase().includes(term))));$('#roomCount').textContent=`${list.length} von ${rooms.length} Räumen`;rows.innerHTML=list.length?list.map(r=>`<a class="room-card" href="/static/room-detail.html?id=${r.id}"><div class="room-card-top"><div><h3>${esc(r.name||'Unbenannter Raum')}</h3><div class="room-number">${esc(r.room_number||'Raumnummer nicht hinterlegt')}</div></div><span class="room-status">${esc(r.status||'Aktiv')}</span></div><div class="room-meta"><div><span>Sitzplätze</span><strong>${r.seats??'–'}</strong></div><div><span>Kategorie</span><strong>${esc(r.category||'–')}</strong></div></div><div class="room-location">${esc([r.site,r.building,r.floor].filter(Boolean).join(' · ')||'Standort nicht hinterlegt')}</div></a>`).join(''):'<div class="room-empty">Keine Räume gefunden.</div>'}
async function load(){const r=await fetch('/api/rooms');if(!r.ok)throw Error('Räume konnten nicht geladen werden.');rooms=await r.json();const sites=[...new Set(rooms.map(r=>r.site).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));site.innerHTML='<option value="">Alle Standorte</option>'+sites.map(x=>`<option>${esc(x)}</option>`).join('');render()}
q.oninput=render;filter.oninput=render;site.onchange=render;$('#excelFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;result.textContent='Import wird verarbeitet …';result.hidden=false;const fd=new FormData();fd.append('file',file);try{const r=await fetch('/api/rooms/import',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.detail?.message||d.detail||'Import fehlgeschlagen.');result.textContent=`✓ ${d.message}${d.errors?.length?` · ${d.errors.length} Zeilen mit Fehlern`:''}`;await load()}catch(err){result.textContent='✕ '+err.message}finally{e.target.value=''}};load().catch(e=>{const x=$('#error');x.textContent=e.message;x.hidden=false});
</script></body></html>
