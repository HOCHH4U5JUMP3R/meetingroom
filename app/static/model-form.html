<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modell · Meetingroom</title><link rel="stylesheet" href="/static/style.css?v=41"><link rel="stylesheet" href="/static/forms.css?v=2"></head><body class="v2"><header class="form-header"><div><div class="eyebrow">ASSET CATALOG</div><h1 id="pageTitle">Modell anlegen</h1><p>Produktstammdaten einmal sauber pflegen. Geräte übernehmen diese Daten automatisch.</p></div></header><main><form id="modelForm" class="formPage"><section class="card"><div class="cardHead"><h3>Produktstammdaten</h3></div><div class="formGrid"><div class="field"><label>Name *</label><input name="name" required placeholder="z. B. Logitech Rally Bar"></div><div class="field"><label>Hersteller</label><input name="manufacturer" placeholder="z. B. Logitech"></div><div class="field"><label>Modell / Artikelnummer</label><input name="model_number"></div><div class="field"><label>Kategorie *</label><select name="category" required><option value="">Bitte auswählen</option><option>Monitor</option><option>TV / Display</option><option>VC-System</option><option>Kamera</option><option>Mikrofon</option><option>Lautsprecher</option><option>PC</option><option>Netzwerk</option><option>Steuerung</option><option>Zubehör</option><option>Sonstiges</option></select></div><div class="field" id="field-size"><label>Größe (Zoll)</label><input name="size_inches" type="number" min="1" step="0.1"><span class="field-hint">Nur bei Monitoren / TVs / Displays relevant.</span></div><div class="field" id="field-mounting"><label>Montage</label><select name="mounting"><option value="">Keine Angabe</option><option>Wand</option><option>Decke</option><option>Tisch</option><option>Ständer</option><option>Rack</option><option>Einbau</option><option>Mobil</option></select></div><div class="field full"><label>Beschreibung</label><textarea name="description" rows="4" placeholder="Technische Kurzbeschreibung, Besonderheiten …"></textarea></div><div class="field full"><label>Produktbild</label><input name="image" type="file" accept="image/*"><span class="field-hint">Das Bild wird bei allen zugeordneten Geräten als Modellbild verwendet.</span></div></div></section><p id="message" class="form-message" role="alert"></p><div class="formActions pageActions"><a class="btn" href="/static/models.html">Abbrechen</a><button class="btn btn-primary">Speichern</button></div></form></main><script src="/static/model-form.js?v=1"></script></body></html>
